<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mayank Katnoria — social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #08080a;
    color: #f2efe6;
    font-family: "Space Grotesk", Arial, sans-serif;
    position: relative;
    padding: 54px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    isolation: isolate;
  }
  .grid {
    position: absolute; inset: 0; z-index: -1;
    background-image:
      linear-gradient(90deg, rgba(242,239,230,.07) 1px, transparent 1px),
      linear-gradient(0deg, rgba(242,239,230,.05) 1px, transparent 1px);
    background-size: 25% 33.333%;
    mask-image: radial-gradient(75% 75% at 50% 50%, #000 10%, transparent 85%);
  }
  .orb {
    position: absolute; width: 760px; height: 760px; right: -260px; top: -300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,54,.24), rgba(255,90,54,.04) 45%, transparent 68%);
    filter: blur(20px); z-index: -1;
  }
  .top { display: flex; justify-content: space-between; align-items: center; font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #8f8c85; }
  .top b { color: #f2efe6; font-weight: 400; }
  .top .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #33e6b0; margin-right: 9px; vertical-align: 1px; }
  .name { position: relative; font-size: 168px; font-weight: 700; line-height: .78; letter-spacing: -.075em; margin-left: -6px; margin-top: 6px; }
  .name span { color: transparent; -webkit-text-stroke: 1.6px rgba(242,239,230,.82); }
  .name em { font-style: normal; color: #ff5a36; }
  .meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .tag { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 35px; line-height: 1.15; color: #f2efe6; max-width: 640px; }
  .tag span { color: #ff5a36; }
  .info { font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.8; letter-spacing: .09em; text-transform: uppercase; text-align: right; color: #8f8c85; white-space: nowrap; }
  .info strong { color: #f2efe6; font-weight: 400; }
  .ring { position: absolute; right: 78px; top: 170px; width: 300px; height: 300px; border: 1px dashed rgba(255,90,54,.28); border-radius: 50%; z-index: -1; }
  .ring::after { content: ""; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #ff5a36; box-shadow: 0 0 18px #ff5a36; }
  .ring2 { position: absolute; right: 116px; top: 208px; width: 224px; height: 224px; border: 1px solid rgba(242,239,230,.1); border-radius: 50%; z-index: -1; }
</style>
</head>
<body>
  <div class="grid"></div><div class="orb"></div><div class="ring"></div><div class="ring2"></div>
  <div class="top">
    <span><b>MAYANK KATNORIA</b> — Portfolio 2026</span>
    <span><i class="dot"></i>Open to internships</span>
  </div>
  <div class="name">MAYANK<br /><span>KATNORIA</span><em>.</em></div>
  <div class="meta">
    <p class="tag">Full-stack systems.<br /><span>Interfaces that feel effortless.</span></p>
    <div class="info">
      <strong>IIIT Lucknow · B.Tech CSE ’28</strong><br />
      Full-stack developer · Competitive programmer<br />
      mayankkatnoria518@gmail.com
    </div>
  </div>
</body>
</html>
